<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Life Simulator</title>
    <link rel="icon" href="data:," />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-gray-100 text-gray-800 transition-colors duration-300">
    <!-- Character Creation Screen -->
    <div
      id="character-creation-screen"
      class="min-h-screen flex flex-col items-center justify-center p-4 relative"
    >
      <!-- Container for top-right buttons -->
      <div class="absolute top-4 right-4 flex space-x-2">
        <!-- Help Button -->
        <button
          id="help-button-creation"
          class="p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none"
          aria-label="Help"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.145 2.007-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.546-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </button>
        <!-- Settings Button -->
        <button
          id="settings-button-creation"
          class="p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none"
          aria-label="Settings"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            />
          </svg>
        </button>
      </div>

      <div class="w-full max-w-md">
        <h1 class="text-3xl font-bold mb-6 text-center dark:text-white">
          Create Your Character
        </h1>
        <div class="mb-4">
          <label
            for="character-name"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
            >Name:</label
          >
          <input
            type="text"
            id="character-name"
            class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 dark:text-white"
            placeholder="Character Name"
          />
        </div>
        <div class="mb-6">
          <label
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
            >Gender:</label
          >
          <div class="flex space-x-4">
            <button
              id="gender-male-button"
              data-gender="male"
              class="flex-1 button-primary bg-blue-500 hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-700"
            >
              Male
            </button>
            <button
              id="gender-female-button"
              data-gender="female"
              class="flex-1 button-primary bg-pink-500 hover:bg-pink-600 dark:bg-pink-600 dark:hover:bg-pink-700"
            >
              Female
            </button>
          </div>
          <p
            id="selected-gender-text"
            class="text-sm text-gray-600 dark:text-gray-400 mt-2 text-center"
          ></p>
        </div>
        <button
          id="start-life-button"
          class="w-full button-primary button-success dark:bg-green-600 dark:hover:bg-green-700"
        >
          Start Life
        </button>
      </div>
    </div>

    <!-- Main Game Screen (hidden by default) -->
    <div id="game-screen" class="hidden min-h-screen flex flex-col">
      <!-- Stats Panel -->
      <div
        id="stats-panel"
        class="bg-white dark:bg-gray-800 p-3 shadow-md sticky top-0 z-50"
      >
        <div class="flex justify-between items-center mb-2">
          <div class="flex items-center space-x-4">
            <div id="character-portrait-container" class="w-16 h-16 rounded-full overflow-hidden bg-gray-200 dark:bg-gray-600 flex-shrink-0 border-2 border-gray-300 dark:border-gray-500">
                <img id="character-portrait" src="" alt="Character Portrait" class="w-full h-full object-cover">
            </div>
            <div>
                <h2 id="player-name-age" class="text-lg font-semibold dark:text-white">
                    Name (Age: 0)
                </h2>
                <span id="player-money" class="text-lg font-semibold text-green-600 dark:text-green-400">
                    Money: $1000
                </span>
            </div>
          </div>
          <div class="flex items-center">
            <!-- Help Button -->
            <button
              id="help-button-game"
              class="p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none ml-2"
              aria-label="Help"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.145 2.007-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.546-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </button>
            <!-- Settings Button -->
            <button
              id="settings-button-game"
              class="p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none ml-2"
              aria-label="Settings"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
            </button>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-x-4 gap-y-2 text-sm">
          <div class="dark:text-gray-300">
            <span>Health: </span><span id="health-value">100</span
            ><span>/100</span>
            <div class="stat-bar-bg dark:bg-gray-700 mt-1">
              <div
                id="health-bar"
                class="stat-bar-fill bg-green-500"
                style="width: 100%"
              ></div>
            </div>
          </div>
          <div class="dark:text-gray-300">
            <span>Happiness: </span><span id="happiness-value">100</span
            ><span>/100</span>
            <div class="stat-bar-bg dark:bg-gray-700 mt-1">
              <div
                id="happiness-bar"
                class="stat-bar-fill bg-yellow-400"
                style="width: 100%"
              ></div>
            </div>
          </div>
          <div class="dark:text-gray-300">
            <span>Smarts: </span><span id="smarts-value">50</span
            ><span>/100</span>
            <div class="stat-bar-bg dark:bg-gray-700 mt-1">
              <div
                id="smarts-bar"
                class="stat-bar-fill bg-blue-500"
                style="width: 50%"
              ></div>
            </div>
          </div>
          <div class="dark:text-gray-300">
            <span>Looks: </span><span id="looks-value">50</span
            ><span>/100</span>
            <div class="stat-bar-bg dark:bg-gray-700 mt-1">
              <div
                id="looks-bar"
                class="stat-bar-fill bg-pink-500"
                style="width: 50%"
              ></div>
            </div>
          </div>
        </div>
        <div class="mt-2 text-xs text-gray-600 dark:text-gray-400">
          <p id="player-job">Job: Unemployed</p>
          <p id="player-education">Education: Uneducated</p>
        </div>
        <div
          id="prison-status"
          class="mt-1 text-sm text-red-600 dark:text-red-400 font-semibold hidden"
        ></div>
        <div
          id="homeless-status"
          class="mt-1 text-sm text-red-600 dark:text-red-400 font-bold hidden"
        ></div>
      </div>

      <div
        id="interaction-panel"
        class="flex-grow p-4 overflow-y-auto bg-gray-50 dark:bg-gray-900"
      >
        <div id="message-log" class="mb-4 space-y-2 text-sm"></div>
        <div id="event-area" class="mt-4">
          <h3
            id="event-title"
            class="text-lg font-semibold mb-2 text-center dark:text-white"
          ></h3>
          <div id="event-choices" class="space-y-2"></div>
        </div>
      </div>

      <!-- Main Action Buttons -->
      <div
        id="main-action-buttons"
        class="bg-white dark:bg-gray-800 p-3 grid grid-cols-2 sm:grid-cols-4 gap-2 shadow-up sticky bottom-0 z-50"
      >
        <button
          id="career-button"
          class="button-primary text-sm py-2 dark:bg-indigo-600 dark:hover:bg-indigo-700"
        >
          Career
        </button>
        <button
          id="assets-button"
          class="button-primary button-secondary text-sm py-2 dark:bg-yellow-600 dark:hover:bg-yellow-700"
        >
          Assets
        </button>
        <button
          id="activities-button"
          class="button-primary bg-purple-500 hover:bg-purple-600 text-sm py-2 dark:bg-purple-600 dark:hover:bg-purple-700"
        >
          Activities
        </button>
        <button
          id="relationships-button"
          class="button-primary bg-pink-500 hover:bg-pink-600 text-sm py-2 dark:bg-pink-600 dark:hover:bg-pink-700"
        >
          Relationships
        </button>
      </div>

      <!-- Age Up Button -->
      <button
        id="age-up-button"
        class="w-full button-primary button-success py-3 text-lg font-bold sticky bottom-0 z-50 dark:bg-green-600 dark:hover:bg-green-700"
      >
        Age Up (+1 Year)
      </button>
    </div>

    <!-- Game Over Screen -->
    <div
      id="game-over-screen"
      class="hidden min-h-screen flex flex-col items-center justify-center p-4 bg-gray-800 bg-opacity-75"
    >
      <div
        class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl text-center w-full max-w-md"
      >
        <h1 class="text-4xl font-bold text-red-600 dark:text-red-400 mb-4">
          Game Over
        </h1>
        <p id="game-over-name-age" class="text-xl mb-2 dark:text-white"></p>
        <p id="game-over-cause" class="text-lg mb-2 dark:text-gray-300"></p>
        <p id="game-over-money" class="text-lg mb-4 dark:text-green-400"></p>
        <div
          id="game-over-key-events"
          class="text-sm text-gray-700 dark:text-gray-400 mb-6 text-left"
        >
          <h4 class="font-semibold mb-1 dark:text-white">Key Events:</h4>
          <ul id="key-events-list" class="list-disc list-inside space-y-1"></ul>
        </div>
        <div class="space-y-3">
          <button
            id="restart-button"
            class="w-full button-primary dark:bg-blue-600 dark:hover:bg-blue-700"
          >
            Restart
          </button>
        </div>
      </div>
    </div>

    <!-- Generic Modal -->
    <div id="generic-modal" class="modal">
      <div class="modal-content bg-white dark:bg-gray-800">
        <div class="flex justify-between items-center mb-4">
          <h3 id="modal-title" class="text-xl font-semibold dark:text-white">
            Modal Title
          </h3>
          <button
            id="modal-close-button"
            class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white text-2xl"
          >
            &times;
          </button>
        </div>
        <div id="modal-body" class="space-y-3"></div>
        <div id="modal-footer" class="mt-6 flex justify-end space-x-3"></div>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal">
      <div class="modal-content bg-white dark:bg-gray-800 w-full max-w-sm">
        <div class="flex justify-between items-center mb-4">
          <h3
            id="confirmation-title"
            class="text-xl font-semibold dark:text-white"
          >
            Confirm Action
          </h3>
        </div>
        <div id="confirmation-body" class="mb-6">
          <p id="confirmation-message" class="text-gray-700 dark:text-gray-300">
            Are you sure?
          </p>
        </div>
        <div id="confirmation-footer" class="flex justify-end space-x-3">
          <button
            id="confirmation-cancel-button"
            class="button-primary bg-gray-500 hover:bg-gray-600"
          >
            Cancel
          </button>
          <button
            id="confirmation-confirm-button"
            class="button-primary button-danger"
          >
            Confirm
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div
      id="toast-notification"
      class="toast bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-800"
    >
      Test Message
    </div>

    <script src="main.js" type="module"></script>

    <script scr="IS.js"></script>
    
  </body>
</html>
